<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Star Dodge</title>
  <style>
    html, body { margin: 0; height: 100%; background: #05060f; overflow: hidden;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
    canvas { display: block; width: 100vw; height: 100dvh; }
    #safe { position: fixed; visibility: hidden; padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="safe"></div>
  <script>
  (() => {
    // ---------- Language: follows the launcher setting, else the phone language ----------
    const lang = localStorage.getItem('pocket.lang') ||
      ((navigator.language || 'en').toLowerCase().startsWith('de') ? 'de' : 'en');
    const T = {
      en: { title: 'STAR DODGE', start: 'Tap to start', retry: 'Tap to try again',
            how: 'Drag anywhere to steer', score: 'Score', best: 'Best', newBest: 'New record!' },
      de: { title: 'STERNEN-AUSWEICHER', start: 'Tippen zum Starten', retry: 'Tippen für neuen Versuch',
            how: 'Irgendwo ziehen zum Lenken', score: 'Punkte', best: 'Rekord', newBest: 'Neuer Rekord!' },
    }[lang];
    document.documentElement.lang = lang;

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const BEST_KEY = 'star-dodge.best';

    let W = 0, H = 0, safeTop = 0, safeBottom = 0;
    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const s = getComputedStyle(document.getElementById('safe'));
      safeTop = parseFloat(s.paddingTop) || 0;
      safeBottom = parseFloat(s.paddingBottom) || 0;
      if (ship) { ship.y = shipY(); ship.x = Math.min(ship.x, W - 20); }
    }
    const shipY = () => H - safeBottom - Math.max(90, H * 0.14);
    window.addEventListener('resize', resize);

    const rand = (a, b) => a + Math.random() * (b - a);
    const bgStars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), z: rand(0.2, 1) }));

    let mode = 'menu';            // menu | play | over
    let best = +localStorage.getItem(BEST_KEY) || 0;
    let score = 0, time = 0, overAt = 0, newRecord = false;
    let ship = null, targetX = 0, rocks = [], stars = [], particles = [];
    let rockTimer = 0, starTimer = 0;

    function reset() {
      ship = { x: W / 2, y: shipY(), r: 16 };
      targetX = ship.x;
      rocks = []; stars = []; particles = [];
      score = 0; time = 0; rockTimer = 0.5; starTimer = 1.5; newRecord = false;
    }

    // ---------- Input: relative drag so your finger never covers the ship ----------
    let lastX = null;
    canvas.addEventListener('pointerdown', e => {
      lastX = e.clientX;
      if (mode === 'menu' || (mode === 'over' && performance.now() - overAt > 700)) {
        reset(); mode = 'play';
      }
    });
    canvas.addEventListener('pointermove', e => {
      if (lastX === null || mode !== 'play') return;
      targetX = Math.max(20, Math.min(W - 20, targetX + (e.clientX - lastX) * 1.4));
      lastX = e.clientX;
    });
    const release = () => { lastX = null; };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);

    function burst(x, y, color, n, speed) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2, v = rand(speed * 0.3, speed);
        particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.4, 0.9), color });
      }
    }

    function gameOver() {
      mode = 'over'; overAt = performance.now();
      burst(ship.x, ship.y, '#ff8a3d', 60, 320);
      if (navigator.vibrate) navigator.vibrate(200);
      if (Math.floor(score) > best) {
        best = Math.floor(score); newRecord = true;
        localStorage.setItem(BEST_KEY, best);
      }
    }

    // ---------- Game logic ----------
    function update(dt) {
      for (const s of bgStars) {
        s.y += dt * s.z * (mode === 'play' ? 0.12 + time / 400 : 0.05);
        if (s.y > 1) { s.y = 0; s.x = Math.random(); }
      }
      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.97; p.vy *= 0.97; p.life -= dt;
      }
      particles = particles.filter(p => p.life > 0);
      if (mode !== 'play') return;

      time += dt;
      const speed = 1 + time / 30;
      score += dt * 5 * speed;

      ship.x += (targetX - ship.x) * Math.min(1, dt * 14);

      rockTimer -= dt;
      if (rockTimer <= 0) {
        const r = rand(12, 26) * (1 + Math.min(time / 120, 0.5));
        const pts = Array.from({ length: 9 }, () => rand(0.75, 1.15));
        rocks.push({ x: rand(r, W - r), y: -r, r, vy: rand(150, 230) * speed, vx: rand(-30, 30),
                     rot: 0, vr: rand(-2, 2), pts });
        rockTimer = Math.max(0.16, 0.75 - time / 70) * rand(0.7, 1.3);
      }
      starTimer -= dt;
      if (starTimer <= 0) {
        stars.push({ x: rand(20, W - 20), y: -20, vy: 170 * speed, spin: 0 });
        starTimer = rand(1.1, 2.2);
      }

      for (const r of rocks) {
        r.y += r.vy * dt; r.x += r.vx * dt; r.rot += r.vr * dt;
        if (Math.hypot(r.x - ship.x, r.y - ship.y) < r.r * 0.85 + ship.r * 0.7) { gameOver(); return; }
      }
      rocks = rocks.filter(r => r.y < H + 40);

      for (const s of stars) {
        s.y += s.vy * dt; s.spin += dt * 3;
        if (!s.taken && Math.hypot(s.x - ship.x, s.y - ship.y) < 30) {
          s.taken = true; score += 25; burst(s.x, s.y, '#ffd65c', 18, 180);
        }
      }
      stars = stars.filter(s => !s.taken && s.y < H + 30);
    }

    // ---------- Drawing ----------
    function drawStar(x, y, rOut, rIn, rot) {
      ctx.beginPath();
      for (let i = 0; i < 10; i++) {
        const r = i % 2 ? rIn : rOut, a = rot + (i * Math.PI) / 5 - Math.PI / 2;
        ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
      }
      ctx.closePath(); ctx.fill();
    }

    function drawShip() {
      const { x, y } = ship;
      ctx.fillStyle = Math.random() < 0.5 ? '#ff8a3d' : '#ffd65c'; // flame
      ctx.beginPath(); ctx.moveTo(x - 7, y + 14); ctx.lineTo(x, y + 26 + Math.random() * 10);
      ctx.lineTo(x + 7, y + 14); ctx.fill();
      ctx.fillStyle = '#e8ecff';
      ctx.beginPath(); ctx.moveTo(x, y - 22); ctx.lineTo(x + 16, y + 16); ctx.lineTo(x, y + 9);
      ctx.lineTo(x - 16, y + 16); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#7c6cff';
      ctx.beginPath(); ctx.arc(x, y - 2, 5, 0, Math.PI * 2); ctx.fill();
    }

    function text(str, x, y, size, color = '#fff', weight = 800) {
      ctx.fillStyle = color;
      ctx.font = `${weight} ${size}px -apple-system, system-ui, sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(str, x, y);
    }

    function draw() {
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#0b0d24'); g.addColorStop(1, '#05060f');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

      for (const s of bgStars) {
        ctx.fillStyle = `rgba(255,255,255,${s.z * 0.8})`;
        ctx.fillRect(s.x * W, s.y * H, s.z * 2, s.z * 2);
      }

      ctx.fillStyle = '#ffd65c';
      for (const s of stars) drawStar(s.x, s.y, 13, 6, s.spin);

      for (const r of rocks) {
        ctx.save(); ctx.translate(r.x, r.y); ctx.rotate(r.rot);
        ctx.fillStyle = '#6b5f73'; ctx.strokeStyle = '#3d3445'; ctx.lineWidth = 3;
        ctx.beginPath();
        r.pts.forEach((k, i) => {
          const a = (i / r.pts.length) * Math.PI * 2;
          ctx.lineTo(Math.cos(a) * r.r * k, Math.sin(a) * r.r * k);
        });
        ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }

      if (mode === 'play') drawShip();

      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life);
        ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;

      const cx = W / 2, top = safeTop + 40;
      if (mode === 'play') {
        text(Math.floor(score), cx, top, 30);
      } else if (mode === 'menu') {
        text(T.title, cx, H * 0.38, Math.min(38, W / 11));
        text(T.how, cx, H * 0.38 + 40, 16, '#9a9db5', 500);
        text(T.start, cx, H * 0.6, 22, '#ffd65c', 700);
        if (best) text(`${T.best}: ${best}`, cx, H * 0.6 + 36, 16, '#9a9db5', 600);
      } else {
        text(`${T.score}: ${Math.floor(score)}`, cx, H * 0.38, 34);
        text(newRecord ? T.newBest : `${T.best}: ${best}`, cx, H * 0.38 + 40, 18,
             newRecord ? '#ffd65c' : '#9a9db5', 700);
        if (performance.now() - overAt > 700) text(T.retry, cx, H * 0.6, 22, '#ffd65c', 700);
      }
    }

    // ---------- Main loop ----------
    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      update(dt); draw();
      requestAnimationFrame(frame);
    }
    document.addEventListener('visibilitychange', () => { last = performance.now(); });

    resize();
    requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
